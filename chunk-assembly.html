<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chunk Assembly</title>
<style>
  :root {
    --bg: #cbcac7;
    --ink: #1c1c1d;
    --mute: #5f5f60;
    --track: rgba(0, 0, 0, .14);
    --fill: rgba(0, 0, 0, .62);
    --accent: #c2410c;
    --panel: rgba(244, 243, 240, .82);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; outline: none; }
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { pointer-events: none; }
  #cap { position: fixed; left: 28px; top: 24px; max-width: min(480px, calc(100vw - 32px)); pointer-events: none; }
  #cap > * { text-shadow: 0 0 10px var(--bg), 0 0 18px var(--bg); }
  #num { font-size: 12px; letter-spacing: .06em; color: var(--mute); font-variant-numeric: tabular-nums; }
  #title { font-size: 30px; font-weight: 300; margin: 4px 0 8px; line-height: 1.12; }
  #layer { font-size: 13px; color: #7a4930; font-variant-numeric: tabular-nums; }
  #layer:empty { display: none; }
  #tools { position: fixed; right: 20px; top: 20px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 40px); }
  #bar { position: fixed; left: 20px; right: 20px; bottom: 18px; display: flex; align-items: center; gap: 12px; }
  button, select { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid rgba(0,0,0,.12);
    border-radius: 6px; height: 30px; padding: 0 11px; cursor: pointer; backdrop-filter: blur(6px); }
  button:hover, select:hover { background: #fff; }
  button[aria-pressed="true"] { background: var(--ink); color: #f4f3f0; border-color: var(--ink); }
  #play { width: 38px; padding: 0; display: grid; place-items: center; }
  #play svg { width: 13px; height: 13px; fill: currentColor; }
  #track { flex: 1; position: relative; height: 30px; cursor: pointer; touch-action: none; }
  .seg { position: absolute; top: 13px; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .seg i { position: absolute; inset: 0 auto 0 0; background: var(--fill); width: 0; }
  .seg.on i { background: var(--accent); }
  #head { position: absolute; top: 7px; width: 2px; height: 16px; background: var(--ink); border-radius: 1px; pointer-events: none; }
  #tip { position: absolute; bottom: 30px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; background: var(--ink);
    color: #f4f3f0; padding: 4px 8px; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity .15s; }
  #time { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--bg); font-size: 13px; color: var(--mute); transition: opacity .6s; z-index: 5; }
  #loadbar { width: 240px; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
  #loadbar div { height: 100%; width: 0; background: var(--fill); transition: width .2s; }
  #exportMsg { position: fixed; top: 64px; right: 20px; background: var(--panel); border: 1px solid rgba(0,0,0,.12); border-radius: 6px;
    backdrop-filter: blur(6px); padding: 7px 11px; font-size: 12px; display: none; z-index: 6; }
  input[type=file] { display: none; }
  @media (max-width: 640px) {
    #cap { left: 16px; top: 16px; }
    #title { font-size: 22px; }
    #tools { top: auto; bottom: 60px; right: 16px; max-width: calc(100vw - 32px); }
    #logoBtn, #export { display: none; }
    #bar { left: 16px; right: 16px; bottom: 14px; gap: 8px; }
    #speed { display: none; }
    #time { min-width: 0; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<canvas id="gl"></canvas><canvas id="hud"></canvas>
<div id="cap"><div id="num"></div><div id="title"></div><div id="layer"></div></div>
<div id="tools">
  <button id="orbit" aria-pressed="true" title="Slowly orbit the camera along the timeline">Orbit</button>
  <button id="cut" aria-pressed="false" title="Ghost the outer layers">Cutaway</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   CONFIG: edit freely. Times are in seconds on the timeline clock.
   ===================================================================== */
const END_T = 29.8;              // total length (about 1 s of orbit after the reveal)
const FPS = 30, OUT_W = 1920, OUT_H = 1080, BITRATE = 24e6;
const RECENTER = [207, 25, 0];   // Rhino-space offset applied before the Z-up → Y-up rotation
const FOV = 30;
const ORBIT = { az0: -20, degPerSec: -3, el: 18 };   // azimuth in degrees from Rhino +X (−90 = looking at the front/section face)
const SHADOW_GROUND = 0.16;       // opacity of the shadow-catcher under the model (0 = off)
const DEFAULT_TRAVEL = 0.9;       // seconds each piece takes to fly in (capped by its layer's duration)

// Materials: first rule whose regex matches the layer name wins. Edit colors here.
const MATS = {
  steel:   { color:'#7c3f24', metalness:.35, roughness:.72 },
  metal:   { color:'#8e9296', metalness:.75, roughness:.42 },
  pink:    { color:'#efc9c6', metalness:0,   roughness:.95 },
  drywall: { color:'#f3f1ea', metalness:0,   roughness:.9 },
  cement:  { color:'#bab09d', metalness:0,   roughness:.95 },
  black:   { color:'#151515', metalness:0,   roughness:.7 },
  rubber:  { color:'#2a2a2a', metalness:0,   roughness:.95 },
  alum:    { color:'#d6d9dc', metalness:.6,  roughness:.32 },
  glass:   { color:'#d3e8f3', metalness:0,   roughness:.05, opacity:.28 },
  led:     { color:'#ffffff', metalness:.1,  roughness:.45 },   // per-instance color (black → gradient)
  ledcab:  { color:'#333333', metalness:.4,  roughness:.6 },
  concrete:{ color:'#a89f93', metalness:0,   roughness:.95, wet:'#5f5a54' },
  stainless:{color:'#cfd2d6', metalness:.95, roughness:.22 },
  castiron:{ color:'#3a3634', metalness:.55, roughness:.7 },
  floor:   { color:'#d0d1d1', metalness:.1,  roughness:.7 },
};
const MAT_RULES = [
  [/Glass|IGU/, 'glass'],
  [/Display Modules/, 'led'],
  [/LED Cabinets/, 'ledcab'],
  [/Painted Black|Air and Water Barrier|Membrane/, 'black'],
  [/Isolator|EPDM|Gasket/, 'rubber'],
  [/Batt|Rigid Insulation|Pipe Insulation/, 'pink'],
  [/Gypsum/, 'drywall'],
  [/Cement Board/, 'cement'],
  [/Concrete/, 'concrete'],
  [/Stainless/, 'stainless'],
  [/Cast Iron|Strainer|Overflow Drain/, 'castiron'],
  [/Access Floor Panels/, 'floor'],
  [/Rail|Clip|Rivet|Screw|Bolt|Fastener|Stud|Anchor|Standoff|Pedestal|Deck|Mesh|Sub-Girt|Lock|Bracket|Knife Plate|Cleat|Slip|Pan|Backing Plate|LED Support Frame|Stiffener|Pressure Plate/, 'metal'],
  [/Aluminum|Panel|Frame(s)? *$|Window Frames|Mullion|Transom|Cap|Snap Cover|Sill|Jamb|Flashing|Base Shoe|Upstand/, 'alum'],
  [/W\d|HSS|Truss|Rib|Girt|Rafter|Gusset|Bearing Plate|Fill Plate|Ledge|Corner Frame|Hanger|Girder|Beam|Tube/, 'steel'],
  [/.*/, 'metal'],
];

// Methods: drop (from above), rise (Explosion A, from below), explode (Explosion B, spherical),
// fade (in place), grow (clip plane rising in Z), sweep (clip plane along X).
// Each layer entry: 'Component' or {c:'Component', method, dist, w (relative duration weight), sort:'z+'|'z-'|'x+'|'x-', cure, axis}
const PHASES = [
 { prefix:'10 Primary Structure', label:'Primary Structure', t:[0.0, 3.2], method:'drop', dist:45, layers:[
   'Truss Bottom Chords (HSS 18x18)','Truss Top Chords (HSS 18x18)','Truss Diagonals (HSS 14x14)','Truss Gusset Plates',
   'Floor Truss Chords (HSS 4x4) (Mezzanine)','Floor Truss Webs (HSS 3x3) (Mezzanine)','Floor Truss Gusset Plates (Mezzanine)',
   'Floor Girders (W21)','Floor Beams (W21)','Floor Edge Ring Beams (W21)',
   'Floor Beam Shear Tabs','Floor Beam Connection Bolts']},
 { prefix:'20 Floor Slabs', label:'Floor Slabs', t:[2.8, 5.3], method:'drop', dist:14, layers:[
   'Composite Metal Floor Deck (Truss Level)','Composite Deck Shear Studs','Slab Edge Pour Stops (Truss Level)','Pour Stop Expansion Anchors','Floor Slab Wire Mesh (Truss Level)',
   {c:'Concrete Floor Topping (Truss Level)', method:'sweep', cure:true, w:1.4},
   'Composite Metal Floor Deck (Mezzanine)','Slab Edge Pour Stops (Mezzanine)','Floor Slab Wire Mesh (Mezzanine)',
   {c:'Concrete Floor Topping (Mezzanine)', method:'sweep', cure:true, w:1.4},
   'Composite Metal Floor Deck','Slab Edge Pour Stops','Floor Slab Wire Mesh',
   {c:'Concrete Floor Topping and Curbs', method:'sweep', cure:true, w:1.4}]},
 { prefix:'30 Shell Framing', label:'Shell Framing', t:[5.0, 8.7], method:'drop', dist:40, layers:[
   'Outer Wall Ribs (W18)','Wall Base Corner Frames (W6)','Corner Frame Hangers (L3x3)','Corner Frame Slip Connections','Outer Wall Top Ribs (W12)',
   'Inner Shell Ribs (W18)','Inner Shell Branch Ribs (Built-Up Plate)','Second Facade Ribs (HSS 8x8)','Second Facade Girts (HSS 4x4)',
   'Roof Ledge Beams (W8X31)','Roof Ledge Angles (L4x4)','Ledge Fill Plates','Roof Glazing Steel Rafters (HSS 8x4)','Sloped Glazing Steel Tubes',
   'Rafter Bearing Plates','Gutter Pan Support Brackets',{c:'Rainscreen Standoffs', method:'explode', dist:12}]},
 { prefix:'40 Soffits', label:'Soffits', t:[8.4, 10.3], method:'rise', dist:14, layers:[
   'Soffit Sub-Girts','Soffit Sub-Girt Clip Angles','Soffit Sub-Girt Bolts','Soffit Hanger Rails','Soffit Hanger Rails (Mezzanine)','Truss Soffit Hanger Rails',
   'Soffit Aluminum Brackets','Soffit Thermal Isolator Pads','Truss Soffit Isolator Pads','Truss Soffit Clip Brackets','Soffit Bracket Screws',
   'Soffit Hook Clips','Soffit Slide Clips','Soffit Panels','Soffit Panels (Mezzanine)','Truss Soffit Panels','Soffit Clip Rivets']},
 { prefix:'50 Exterior Wall', label:'Exterior Wall', t:[10.0, 16.6], method:'explode', dist:22, layers:[
   'Outer Wall Cement Board Sheathing','Outer Wall Sheathing Fasteners','Outer Wall Air and Water Barrier','Outer Wall Batt Insulation',
   {c:'Outer Wall Bracket Isolator Pads', w:1.6},{c:'Outer Wall Rail Brackets', w:1.6},{c:'Outer Wall Panel Hanger Rails', method:'grow', w:1.6},
   {c:'Outer Wall Panel Hook Clips', w:1.6},{c:'Outer Wall Panel Slide Clips', w:1.6},{c:'Outer Wall Panel Stiffeners', w:1.6},
   {c:'Outer Wall Aluminum Panels', w:2.2},{c:'Outer Wall Clip Rivets and Screws', w:1.6},
   'Bent Corner Panels','Soffit Corner Panels','Fin Interior Aluminum Panels',
   'Inner Shell Cement Board Sheathing','Inner Shell Air and Water Barrier','Inner Shell Batt Insulation','Inner Shell Bracket Isolator Pads',
   'Inner Shell Rail Brackets',{c:'Inner Shell Panel Hanger Rails', method:'grow'},'Inner Shell Panel Hook Clips','Inner Shell Panel Slide Clips',
   'Inner Shell Aluminum Panels','Inner Shell Clip Rivets and Screws','Inner Shell Opening Closure Panels',
   'Second Facade Inner Aluminum Panels','Second Facade Outer Aluminum Panels']},
 { prefix:'60 Interior Floors', label:'Interior Floors', t:[16.3, 18.2], method:'drop', dist:8, layers:[
   'Access Floor Pedestals (Truss Level)','Raised Access Floor Panels (Truss Level)',
   {c:'Floor Waterproofing Membrane (Mezzanine)', method:'fade'},'Floor Rigid Insulation (Mezzanine)','Floor Cement Board Backing (Mezzanine)','Access Floor Pedestals (Mezzanine)','Raised Access Floor Panels (Mezzanine)',
   {c:'Floor Waterproofing Membrane', method:'fade'},'Floor Rigid Insulation','Floor Cement Board Backing','Access Floor Pedestals','Raised Access Floor Panels']},
 { prefix:'65 Interior Walls', label:'Interior Walls', t:[17.9, 19.8], method:'rise', dist:10, layers:[
   'Outer Wall Interior Batt Insulation','Outer Wall Interior Cement Board','Outer Wall Gypsum Board',
   'Inner Shell Interior Batt Insulation','Inner Shell Interior Cement Board','Inner Shell Gypsum Board']},
 { prefix:'70 LED Wall', label:'LED Wall', t:[19.5, 22.6], method:'explode', dist:16, layers:[
   'LED Frame Knife Plate Anchors','LED Support Frame (HSS 4x4)','LED Wall Backing Batt Insulation','LED Wall Backing Board (Painted Black)',
   'LED Standoff Arms',{c:'LED Mounting Rails (HSS 2x2)', method:'grow'},'LED Mounting Brackets (L2x2)',{c:'LED Cabinets', w:1.5},'LED Cabinet Locks']},
 { prefix:'80 Roof Drainage', label:'Roof Drainage', t:[22.4, 24.3], method:'drop', dist:10, layers:[
   'Gutter Support Pans','Gutter Backing Plates','Gutter Rigid Insulation',{c:'Gutter Self-Healing Membrane', method:'fade'},'Gutter Liner Cleats',
   'Gutter Liners (Stainless)','Gutter Flashing Upstands','Gutter Outlets (Stainless)','Outlet Dome Strainers','Overflow Drains',
   'Rain Leaders (Cast Iron)','Rain Leader Pipe Insulation']},
 { prefix:'55 Glazing', label:'Glazing', t:[24.0, 26.3], method:'drop', dist:12, layers:[
   'Sloped Glazing Sill Flashing','Sloped Glazing Sills','Sloped Glazing Mullions','Sloped Glazing Transoms','Sloped Glazing Thermal Isolators',
   {c:'Sloped Glazing EPDM Gaskets', method:'fade'},'Sloped Glazing IGUs','Sloped Glazing Pressure Plates','Sloped Glazing Snap Covers','Sloped Glazing Sill Caps',
   'Roof Glazing Mullions','Roof Glazing Transoms','Roof Glazing IGUs',
   'Wall Window Frames','Wall Window Glass','Wall Window Jamb Closures','Mezzanine Guard Base Shoe','Mezzanine Guard Glass']},
 { prefix:'70 LED Wall', label:'LED Display Modules', t:[26.0, 27.9], method:'explode', dist:8, layers:[
   {c:'LED Display Modules', travel:0.6}]},
];
// LED colour reveal across the wall (per instance)
const REVEAL = { layer:'70 LED Wall::LED Display Modules', t:[27.0, 28.8], colors:['#1d3bff','#8a2be2','#ff2a2a'], glow:1.4, sweep:0.55 };

// Camera push-ins. Window = from the start of `from` (minus padIn) to the end of `to` (plus padOut).
// focus: 'hero' = Rhino Y −50…−42.2, Z 62…66 strip; 'roof' = glass roof at the front section.
const PUSH = [
  { name:'hero', from:'50 Exterior Wall::Outer Wall Bracket Isolator Pads', to:'50 Exterior Wall::Outer Wall Clip Rivets and Screws',
    padIn:0.9, padOut:0.5, az:-62, el:12, dist:26, tagRadius:14 },
  { name:'roof', from:'80 Roof Drainage::Gutter Support Pans', to:'55 Glazing::Roof Glazing IGUs',
    padIn:0.9, padOut:0.4, az:-75, el:24, dist:48, tagRadius:22 },
];
// Optional automatic ghosting (e.g. while interior layers arrive). Off by default; the front section is open.
const GHOST_WINDOWS = [
  // { match:/^50 Exterior Wall::(Outer Wall|Second Facade|Bent|Soffit Corner|Fin)/, t:[16.0, 22.8], alpha:0.15 },
];
const CUTAWAY_MATCH = /^50 Exterior Wall::(Outer Wall|Second Facade|Bent|Soffit Corner|Fin)|^30 Shell Framing::(Outer Wall|Second Facade)/;

/* ===================================================================== */

const $ = id => document.getElementById(id);
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const lerp = (a, b, t) => a + (b - a) * t;
const comp = name => name.split('::')[1] || name;

// ---------- renderer / scene ----------
const glCanvas = $('gl'), hudCanvas = $('hud'), hud = hudCanvas.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cbcac7');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(FOV, 16 / 9, 1, 5000);
const controls = new OrbitControls(camera, glCanvas);
controls.enableDamping = false;

const rootY = new THREE.Group(); rootY.rotation.x = -Math.PI / 2; scene.add(rootY);   // Z-up → Y-up
const root = new THREE.Group(); root.position.set(...RECENTER); rootY.add(root);       // children are in raw Rhino coords
scene.updateMatrixWorld(true);
const toThree = v => new THREE.Vector3(v[0], v[1], v[2]).applyMatrix4(root.matrixWorld);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b4ac, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// ---------- shader patch: per-piece offset/alpha from a state texture ----------
const VERT_HEAD = `
uniform highp sampler2D uState; uniform int uStateW;
#ifdef PIECE_ATTR
attribute float aPiece;
#endif
varying float vPA; varying vec3 vRP;
`;
const VERT_PROJ = `
#ifdef PIECE_ATTR
  int pid = int(aPiece + 0.5);
#else
  int pid = gl_InstanceID;
#endif
  vec4 st = texelFetch(uState, ivec2(pid % uStateW, pid / uStateW), 0);
  vPA = st.w;
  vec4 mvPosition = vec4(transformed, 1.0);
#ifdef USE_INSTANCING
  mvPosition = instanceMatrix * mvPosition;
#endif
  mvPosition.xyz += st.xyz;
  vRP = mvPosition.xyz;
  mvPosition = modelViewMatrix * mvPosition;
  gl_Position = projectionMatrix * mvPosition;
  if (vPA < 0.003) gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
`;
const WORLDPOS = `
#if defined( USE_ENVMAP ) || defined( DISTANCE ) || defined ( USE_SHADOWMAP ) || defined ( USE_TRANSMISSION ) || NUM_SPOT_LIGHT_COORDS > 0
  vec4 worldPosition = modelMatrix * vec4(vRP, 1.0);
#endif
`;
const FRAG_HEAD = `
uniform float uLayerAlpha; uniform vec4 uGrow; uniform float uGlow;
varying float vPA; varying vec3 vRP;
`;
function patchMaterial(mat, U, depth) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = VERT_HEAD + sh.vertexShader
      .replace('#include <project_vertex>', VERT_PROJ)
      .replace('#include <worldpos_vertex>', WORLDPOS);
    let f = FRAG_HEAD + sh.fragmentShader.replace('void main() {', 'void main() {\n  if (dot(vRP, uGrow.xyz) > uGrow.w) discard;');
    if (!depth) {
      f = f.replace('#include <alphamap_fragment>', '#include <alphamap_fragment>\n  diffuseColor.a *= clamp(vPA, 0.0, 1.0) * uLayerAlpha;');
      if (mat.defines && 'LED' in mat.defines)
        f = f.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n  totalEmissiveRadiance += vColor.rgb * uGlow;');
    }
    sh.fragmentShader = f;
  };
  mat.customProgramCacheKey = () => (depth ? 'd' : 'm') + JSON.stringify(mat.defines || {});
}

// ---------- data loading ----------
async function unpack(name) {
  const b64 = window.CHUNK_DATA && window.CHUNK_DATA[name];
  if (!b64) throw new Error('Missing ' + name + ' in chunk_data.js');
  const res = await fetch('data:application/octet-stream;base64,' + b64);
  const buf = await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  window.CHUNK_DATA[name] = null; // free the string
  return buf;
}
const loader = new GLTFLoader();
const parseGLB = buf => new Promise((ok, err) => loader.parse(buf, '', ok, err));
const setProgress = (txt, f) => { $('loadtxt').textContent = txt; $('loadbar').firstChild.style.width = (f * 100).toFixed(0) + '%'; };

const LAYERS = new Map();   // full name → layer
function getLayer(name) {
  if (!LAYERS.has(name)) LAYERS.set(name, { name, parts: [], pieces: [], step: null, bbox: new THREE.Box3() });
  return LAYERS.get(name);
}
function matKeyFor(name) { const c = comp(name); for (const [re, k] of MAT_RULES) if (re.test(c)) return k; return 'metal'; }

function makePart(layer, mesh, n, centers) {
  const W = Math.min(n, 1024), H = Math.ceil(n / W);
  const data = new Float32Array(W * H * 4);
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.FloatType);
  tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.needsUpdate = true;
  const U = { uState: { value: tex }, uStateW: { value: W }, uLayerAlpha: { value: 1 }, uGrow: { value: new THREE.Vector4(0, 0, 0, 1) }, uGlow: { value: 0 } };
  const mk = matKeyFor(layer.name), spec = MATS[mk];
  const mat = new THREE.MeshStandardMaterial({ color: spec.color, metalness: spec.metalness, roughness: spec.roughness, side: THREE.DoubleSide });
  mat.defines = {}; if (!mesh.isInstancedMesh) mat.defines.PIECE_ATTR = ''; if (mk === 'led') mat.defines.LED = '';
  if (spec.opacity != null) { mat.opacity = spec.opacity; mat.transparent = true; mat.depthWrite = false; }
  patchMaterial(mat, U, false);
  const dmat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  dmat.defines = mesh.isInstancedMesh ? {} : { PIECE_ATTR: '' };
  patchMaterial(dmat, U, true);
  mesh.material = mat; mesh.customDepthMaterial = dmat;
  mesh.castShadow = spec.opacity == null; mesh.receiveShadow = true;
  mesh.frustumCulled = false; mesh.visible = false;
  root.add(mesh);
  const part = { mesh, mat, U, tex, data, n, centers, matKey: mk, baseOpacity: spec.opacity ?? 1, restWritten: false };

      const list = cols[side].sort((a, b) => a.ay - b.ay), gap = 34 * s, top = 200 * s, bot = H - 120 * s;
      let yPrev = -1e9; list.forEach(i => { i.ly = Math.max(i.ay, yPrev + gap, top); yPrev = i.ly; });
      const over = yPrev - bot; if (over > 0) list.forEach(i => i.ly -= over);
      for (const i of list) {
        const tw = ctx.measureText(i.tg.label).width, pad = 7 * s, bh = 26 * s;
        const bx = side === 'L' ? 70 * s : W - 70 * s - tw - 2 * pad;
        const ex = side === 'L' ? bx + tw + 2 * pad : bx;
        ctx.globalAlpha = i.a;
        ctx.strokeStyle = '#1c1c1d'; ctx.lineWidth = 1.2 * s;
        ctx.beginPath(); ctx.moveTo(ex, i.ly); ctx.lineTo(ex + (side === 'L' ? 30 : -30) * s, i.ly); ctx.lineTo(i.ax, i.ay); ctx.stroke();
        ctx.beginPath(); ctx.arc(i.ax, i.ay, 3.5 * s, 0, Math.PI * 2); ctx.fillStyle = '#1c1c1d'; ctx.fill();
        ctx.beginPath(); ctx.roundRect(bx, i.ly - bh / 2, tw + 2 * pad, bh, 6 * s);
        ctx.fillStyle = 'rgba(244,243,240,.9)'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.stroke();
        ctx.fillStyle = '#1c1c1d'; ctx.fillText(i.tg.label, bx + pad, i.ly + 6 * s);
        ctx.globalAlpha = 1;
      }
    }
  }
}

// ---------- layout / render loop ----------
let viewW = 0, viewH = 0;
// The camera moves were composed for 16:9. Any window shape shows that whole frame: wider windows
// keep the vertical field of view, taller ones widen it so the sides are never cropped.
function fitCamera(aspect) {
  camera.aspect = aspect;
  camera.fov = aspect >= 16 / 9 ? FOV
    : THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * (16 / 9) / aspect));
  camera.updateProjectionMatrix();
}
function layout() {
  viewW = innerWidth; viewH = innerHeight;
  const pr = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(pr); renderer.setSize(viewW, viewH, false);
  hudCanvas.width = Math.round(viewW * pr); hudCanvas.height = Math.round(viewH * pr);
  fitCamera(viewW / viewH);
}
window.addEventListener('resize', () => { if (!exporting) layout(); });

function fitShadow() {
  const sph = MODEL_BOX.getBoundingSphere(new THREE.Sphere()); const c = toThree([sph.center.x, sph.center.y, sph.center.z]);
  sun.target.position.copy(c); sun.position.copy(c).add(new THREE.Vector3(0.55, 1.0, 0.45).normalize().multiplyScalar(sph.radius * 2.2));
  const r = sph.radius * 1.05, sc = sun.shadow.camera; sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 1; sc.far = sph.radius * 4.5; sc.updateProjectionMatrix();
  if (SHADOW_GROUND > 0) {
    const g = new THREE.Mesh(new THREE.PlaneGeometry(sph.radius * 8, sph.radius * 8), new THREE.ShadowMaterial({ opacity: SHADOW_GROUND }));
    g.position.set(sph.center.x, sph.center.y, MODEL_BOX.min.z - 0.3); g.receiveShadow = true; root.add(g);
  }
}

let playing = false, speed = 1, lastNow = 0, exporting = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (exporting) return;
  const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0; lastNow = now;
  if (playing && !dragging) { T += dt * speed; if (T >= END_T) { T = END_T; setPlaying(false); } }
  if (T !== lastAppliedT) { applyTime(T); lastAppliedT = T; }
  updateUI();
  if (autoCam) placeCamera(T); else controls.update();
  renderer.render(scene, camera);
  drawScreenHUD(hud, hudCanvas.width, hudCanvas.height, T);
}

// ---------- UI: caption, timeline, controls ----------
const track = $('track'), tip = $('tip'), head = $('head');
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
// one segment per phase, from its start to the next phase's start
const SEGS = PHASES.map((p, i) => [p.t[0], i < PHASES.length - 1 ? PHASES[i + 1].t[0] : END_T]);
const segEls = SEGS.map(([a, b]) => {
  const el = document.createElement('div'); el.className = 'seg';
  el.style.left = `calc(${a / END_T * 100}% + 1px)`; el.style.width = `calc(${(b - a) / END_T * 100}% - 2px)`;
  el.appendChild(document.createElement('i')); track.appendChild(el); return el;
});
const ICON = { play: '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>', pause: '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>' };
function setPlaying(v) { playing = v; $('play').innerHTML = v ? ICON.pause : ICON.play; if (v && T >= END_T) T = 0; }
setPlaying(false);
let lastCap = '';
function updateUI() {
  const pi = activePhase(T), ph = PHASES[pi], st = activeLayer(T);
  const cap = pi + '|' + (st && T < END_T - 1.2 ? comp(st.layer.name) : '');
  if (cap !== lastCap) {
    lastCap = cap;
    $('num').textContent = `Chunk assembly · phase ${pi + 1} of ${PHASES.length}`;
    $('title').textContent = ph.label;
    $('layer').textContent = cap.split('|')[1];
  }
  segEls.forEach((el, i) => { const [a, b] = SEGS[i]; el.firstChild.style.width = `${clamp01((T - a) / (b - a)) * 100}%`; el.classList.toggle('on', i === pi); });
  head.style.left = `calc(${T / END_T * 100}% - 1px)`;
  $('time').textContent = `${fmt(T)} / ${fmt(END_T)}`;
}
const tAt = (e) => { const r = track.getBoundingClientRect(); return clamp01((e.clientX - r.left) / r.width) * END_T; };
let dragging = false;
track.addEventListener('pointerdown', (e) => { dragging = true; track.setPointerCapture(e.pointerId); T = tAt(e); });
track.addEventListener('pointermove', (e) => {
  const t = tAt(e), i = SEGS.findIndex(([a, b]) => t >= a && t < b);
  tip.textContent = `${Math.max(0, i) + 1}. ${PHASES[Math.max(0, i)].label}`; tip.style.left = `${t / END_T * 100}%`; tip.style.opacity = 1;
  if (dragging) T = t;
});
track.addEventListener('pointerleave', () => { tip.style.opacity = 0; });
track.addEventListener('pointerup', () => { dragging = false; });
$('play').onclick = () => setPlaying(!playing);
$('speed').onchange = e => speed = +e.target.value;
const press = (el, v) => el.setAttribute('aria-pressed', v);
$('orbit').onclick = e => { orbitOn = !orbitOn; press(e.currentTarget, orbitOn); };
$('tags').onclick = e => { tagsOn = !tagsOn; press(e.currentTarget, tagsOn); };
if (innerWidth <= 640) { tagsOn = false; press($('tags'), false); } // too many to read on a phone
$('cut').onclick = e => { ghostLive = !ghostLive; press(e.currentTarget, ghostLive); applyTime(T, true); };
$('reset').onclick = () => { autoCam = true; };
controls.addEventListener('start', () => { autoCam = false; });
$('logoBtn').onclick = () => $('logoFile').click();
$('logoFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const im = new Image(); im.onload = () => logoImg = im; im.src = URL.createObjectURL(f); };
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'SELECT') { e.preventDefault(); setPlaying(!playing); } });

// ---------- MP4 export (WebCodecs + mp4-muxer) ----------
$('export').onclick = async () => {
  if (exporting) return;
  if (!('VideoEncoder' in window)) { alert('This browser has no WebCodecs. Use Chrome or Edge.'); return; }
  const msg = $('exportMsg'); msg.style.display = 'block'; msg.textContent = 'Preparing export…';
  let Mp4;
  try { Mp4 = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm'); }
  catch (e) { msg.textContent = 'Could not load the MP4 muxer (needs internet).'; return; }
  exporting = true; setPlaying(false);
  const wasAuto = autoCam; autoCam = true;
  const prevPR = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(OUT_W, OUT_H, false); fitCamera(OUT_W / OUT_H);
  const comp2 = document.createElement('canvas'); comp2.width = OUT_W; comp2.height = OUT_H; const cx = comp2.getContext('2d');
  const hudOff = document.createElement('canvas'); hudOff.width = OUT_W; hudOff.height = OUT_H; const hx = hudOff.getContext('2d');
  let codec = 'avc1.640033';
  const cfg = c => ({ codec: c, width: OUT_W, height: OUT_H, bitrate: BITRATE, framerate: FPS, avc: { format: 'avc' } });
  if (!(await VideoEncoder.isConfigSupported(cfg(codec))).supported) codec = 'avc1.4d0033';
  const muxer = new Mp4.Muxer({ target: new Mp4.ArrayBufferTarget(), video: { codec: 'avc', width: OUT_W, height: OUT_H }, fastStart: 'in-memory' });
  let encErr = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => encErr = e });
  enc.configure(cfg(codec));
  const N = Math.round(END_T * FPS);
  try {
    for (let f = 0; f <= N; f++) {
      const t = Math.min(END_T, f / FPS);
      applyTime(t); placeCamera(t);
      renderer.render(scene, camera);
      cx.drawImage(glCanvas, 0, 0, OUT_W, OUT_H);
      drawHUD(hx, OUT_W, OUT_H, t); cx.drawImage(hudOff, 0, 0);
      const vf = new VideoFrame(comp2, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame: f % FPS === 0 }); vf.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
      if (encErr) throw encErr;
      if (f % 5 === 0) { msg.textContent = `Exporting frame ${f} / ${N}`; await new Promise(r => setTimeout(r)); }
    }
    await enc.flush(); muxer.finalize();
    const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Chunk_Assembly_Sequence.mp4'; a.click();
    msg.textContent = 'Export done: Chunk_Assembly_Sequence.mp4 (' + (blob.size / 1e6).toFixed(1) + ' MB)';
  } catch (e) { console.error(e); msg.textContent = 'Export failed: ' + e.message; }
  finally {
    exporting = false; autoCam = wasAuto; renderer.setPixelRatio(prevPR); layout(); lastAppliedT = -1;
    setTimeout(() => msg.style.display = 'none', 6000);
  }
};

// ---------- go ----------
layout();
try {
  await loadAll();
  buildTimeline();
  fitShadow();
  applyTime(0, true); lastAppliedT = 0;
  $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 700);
  console.log('Layers:', LAYERS.size, 'Steps:', STEPS.length, 'Model box', MODEL_BOX);
  setPlaying(true);
  requestAnimationFrame(frame);
} catch (e) { console.error(e); setProgress('Load failed: ' + e.message, 0); }
window.__chunk = { get T() { return T; }, setT: (t) => { T = Math.min(END_T, Math.max(0, t)); }, setPlaying, END_T, ready: () => !!STEPS.length };
</script>
</body>
